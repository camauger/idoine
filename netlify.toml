# Netlify - Atelier St-Elme
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm install && python -m pip install -r requirements.txt && npx grunt build && npm run seo"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  PYTHON_VERSION = "3.11"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Note : `netlify dev` lance quand même l’initialisation Deno (Edge) côté CLI ; ce site n’a que des
# fonctions Node dans netlify/functions/. En cas d’erreur « Failed to set up Deno » / spawn EBUSY :
#   npm run reset-netlify-deno   puis   just dev
#   ou si deno.exe est déjà dans le cache sans version.txt : npm run ensure-netlify-deno-version
# Le reset supprime ~/.config/netlify/deno-cli et, sous Windows, %APPDATA%\netlify\Config\deno-cli.
# Autre option : winget install Deno.Land  (https://ntl.fyi/install-deno)

# API cours + admin (Neon) : rewrite /api/* vers la function (path conservé via :splat)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Ancienne page /emploi supprimée (août 2026) : redirection permanente
[[redirects]]
  from = "/emploi"
  to = "/"
  status = 301

# Variables d'environnement (Netlify UI > Site settings > Environment variables)
#
# PRODUCTION – Pour que les cours s'affichent :
# 1. Définir DATABASE_URL = URL pooler Neon (Connection string > Pooled dans le dashboard Neon).
# 2. Ne pas définir ATELIER_API_URL (ou laisser vide) pour que le front utilise /api/* sur le même domaine.
# 3. Redéployer après avoir ajouté DATABASE_URL.
#
# DATABASE_URL (obligatoire pour /api/cours et les inscriptions)
#   → Chaîne de connexion Neon (pooler) : postgresql://user:pass@ep-xxx-pooler.neon.tech/dbname?sslmode=require
#   → Utilisée par api.mjs (/api/cours, admin) et submission-created.js (inscriptions du formulaire Netlify).
#
# ATELIER_API_URL (optionnel en prod)
#   → Si défini : le front appelle ce backend externe pour cours/inscriptions.
#   → Si vide ou absent et DATABASE_URL défini : le front appelle /api/* sur le même domaine (Netlify Function).
#   → Le build injecte cette URL dans les pages ; en prod "même origine" on peut laisser vide.

# Contournement sans netlify dev : build, npm run dev:functions (port 9999), serveur statique sur dist,
# ATELIER_API_URL=http://localhost:9999/.netlify/functions — voir aussi la note Deno ci-dessus.

# Netlify Forms (formulaire d’inscription)
#
# Courriels transactionnels (Postmark) — requis pour la confirmation ET la
# notification à l’atelier. Utilisés par netlify/functions/submission-created.js.
#
# POURQUOI C’EST CRITIQUE : sans courriel de confirmation, les gens ne savent pas
# si leur demande est passée et refont le formulaire des heures ou des jours plus
# tard. C’est l’origine des doublons d’inscription constatés à l’été 2026.
#
# 1) Compte Postmark : https://postmarkapp.com
# 2) Vérifier l’expéditeur — Sender Signature sur l’adresse, ou mieux, vérifier
#    le domaine atelierstelme.ca (DKIM + Return-Path dans le DNS). Sans cela
#    Postmark refuse l’envoi (ErrorCode 300).
# 3) Variables Netlify (Site settings > Environment variables), portées Builds ET Functions :
#    POSTMARK_SERVER_TOKEN   → jeton de serveur (Servers > votre serveur > API Tokens)
#    CONFIRMATION_EMAIL_FROM → expéditeur vérifié, ex. Ateliers St-Elme <inscription@atelierstelme.ca>
#    NOTIFICATION_EMAIL_TO   → destinataire(s) de la notification interne, séparés par des virgules
#                              (défaut si absente : info@atelierstelme.ca)
#    NOTIFICATION_EMAIL_FROM → optionnel ; à défaut CONFIRMATION_EMAIL_FROM est réutilisé
#    POSTMARK_MESSAGE_STREAM → optionnel ; défaut "outbound" (flux transactionnel).
#                              Une infolettre exigerait un flux "broadcast" distinct.
#
# PIEGE N°1 — APPROBATION DU COMPTE POSTMARK (constaté le 21 août 2026)
#
# Un compte Postmark neuf est « pending approval ». Dans cet état, Postmark
# REFUSE tout destinataire hors du domaine de l'expéditeur, avec :
#     HTTP 422 / ErrorCode 412
#     « While your account is pending approval, all recipient addresses must
#       share the same domain as the 'From' address. »
#
# Conséquence exacte, et elle est sournoise :
#   • la notification interne (info@atelierstelme.ca) PART — même domaine que
#     l'expéditeur. L'atelier voit donc les inscriptions arriver normalement.
#   • la confirmation à la personne inscrite (gmail, hotmail, videotron…) est
#     REJETÉE à 100 %. Elle ne reçoit rien, doute, et re-soumet le formulaire.
#   → Tout a l'air de marcher côté atelier pendant que rien ne marche côté public.
#     C'est l'origine des doublons d'inscription de l'été 2026.
#
# CORRECTIF : demander l'approbation dans l'interface Postmark
# (https://account.postmarkapp.com — bannière « pending approval » > Request
# approval). Décrire l'usage transactionnel : confirmations d'inscription à des
# cours, volume faible, adresses fournies par les personnes elles-mêmes via le
# formulaire du site. Réponse en quelques heures ouvrables.
#
# VÉRIFIER APRÈS APPROBATION — envoyer un test vers une adresse EXTERNE
# (gmail.com, pas @atelierstelme.ca : un test interne passe même sans approbation
# et donne un faux vert). Le tableau Activity de Postmark doit montrer Delivered.
#
# GARDE-FOU EN PLACE : submission-created.js passe le résultat de la confirmation
# à sendInscriptionNotification. Si la confirmation échoue, la notification interne
# affiche un bandeau rouge « La confirmation n'a PAS été envoyée » avec l'ErrorCode.
# L'échec ne peut plus être silencieux.
#
# NE PAS RÉINSTALLER l'extension Netlify Emails : le code appelle l'API Postmark en
# direct (netlify/functions/lib/sendInscriptionConfirmation.mjs). Les variables
# NETLIFY_EMAILS_* ont été retirées le 21 août 2026 — elles étaient inertes et
# dupliquaient la clé API.
#
# PIEGE N°2 — QUARANTAINE GODADDY ADVANCED EMAIL SECURITY (21 août 2026)
#
# Les MX du domaine pointent vers ppe-hosted.com (GoDaddy AES, moteur Proofpoint).
# Trois courriels Postmark s'y sont fait « Quarantined (by Score) », dont la
# notification d'une VRAIE inscription — que l'atelier n'a donc jamais vue.
#
# CAUSE : le courriel partait de info@atelierstelme.ca ET arrivait à
# info@atelierstelme.ca, depuis une IP externe (Postmark). C'est le motif
# d'usurpation type, et Proofpoint le pénalise lourdement. Ce n'était PAS le DKIM :
# le domaine est vérifié chez Postmark (preuve : il accepte n'importe quelle adresse
# @atelierstelme.ca comme expéditeur, ce qu'il n'autorise qu'après validation DKIM).
#
# CORRIGÉ : CONFIRMATION_EMAIL_FROM est passée à
#     Ateliers St-Elme <inscription@atelierstelme.ca>
# Le ReplyTo pointe vers info@ — et il est désormais réellement posé : le code
# supprimait l'en-tête tant que From et ReplyTo étaient identiques.
# Pas de boîte inscription@ à créer : envoi seul, réponses via ReplyTo, rebonds via
# pm-bounces. NOTIFICATION_EMAIL_FROM reste absente et hérite donc du même From.
#
# RESTE À FAIRE HORS DÉPÔT — deux actions manuelles :
#
#   a) DNS (GoDaddy) — ajouter Postmark au SPF. Non requis par Postmark grâce au
#      Return-Path personnalisé, mais les filtres heuristiques comparent l'IP au SPF
#      du domaine du From : sans l'include, ils voient un écart et montent le score.
#      TXT @ , remplacer la valeur actuelle par :
#      v=spf1 include:spf.protection.outlook.com include:zohobooks.com include:spf.mtasv.net ip4:205.220.189.64/27 -all
#      (3 lookups DNS sur un maximum de 10 — marge confortable.)
#
#   b) GoDaddy AES — mettre l'expéditeur en liste blanche.
#      ⚠ SUR pm-bounces.atelierstelme.ca (l'expéditeur d'enveloppe), JAMAIS sur
#      info@ ni sur atelierstelme.ca : autoriser son propre domaine ouvrirait une
#      brèche d'usurpation à n'importe qui. Le lien « Release & Approve » du digest
#      vise le bon expéditeur — vérifier qu'il approuve bien pm_bounces@... et non info@.
#
# DMARC est à p=none. Une fois (a) posé et la délivrabilité stable, p=quarantine
# renforcerait la réputation du domaine. Pas avant.
#
# Si POSTMARK_SERVER_TOKEN est absente : l’inscription est quand même enregistrée,
# mais AUCUN courriel ne part — ni à la personne, ni à l’atelier. La fonction le
# signale par un console.error visible dans les logs Netlify.

# Netlify Forms — notification automatique
#
# Elle part à CHAQUE soumission, y compris les re-soumissions d’une même personne :
# c’est elle qui produisait deux courriels identiques pour une seule inscription.
# submission-created.js envoie désormais sa propre notification, uniquement
# lorsqu’une place a réellement été créée (ou pour signaler un cours complet).
#
# ORDRE À RESPECTER — ne pas désactiver avant d’avoir validé Postmark, sinon
# l’atelier ne reçoit plus rien du tout :
#   1. Configurer les variables Postmark ci-dessus et redéployer.
#   2. Faire une inscription de test et confirmer la réception des DEUX courriels
#      (celui de la personne et celui de l’atelier).
#   3. Seulement ensuite : Settings > Forms > Form notifications → supprimer la
#      notification « Email » du formulaire « inscription ».
#      FAIT le 26 août 2026 (compte Postmark approuvé, test livré chez Gmail) :
#      les deux hooks « email / submission_created » ont été supprimés via
#      `npx netlify api listHooksBySiteId` puis `npx netlify api deleteHook --data '{"hook_id":"…"}'`.

# Redirections optionnelles (décommenter si besoin)
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
#   force = true
