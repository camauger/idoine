# Netlify - Atelier St-Elme
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm install && python -m pip install -r requirements.txt && npx grunt build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  PYTHON_VERSION = "3.11"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API cours + inscriptions (Neon) : rewrite /api/* vers la function (path conservé via :splat)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Variables d'environnement (Netlify UI > Site settings > Environment variables)
#
# DATABASE_URL (recommandé si vous utilisez les Netlify Functions ci-dessus)
#   → Chaîne de connexion Neon (pooler) : postgresql://user:pass@ep-xxx-pooler.neon.tech/dbname?sslmode=require
#   → Utilisée par netlify/functions/api.mjs pour /api/cours et /api/inscriptions.
#
# ATELIER_API_URL (optionnel en prod)
#   → Si défini : le front appelle ce backend externe pour cours/inscriptions.
#   → Si vide ou absent et DATABASE_URL défini : le front appelle /api/* sur le même domaine (Netlify Function).
#   → Le build injecte cette URL dans les pages ; en prod "même origine" on peut laisser vide.

# netlify dev (Windows) : si erreur "setting up the Edge Functions environment" :
# 1) Installer Deno (recommandé) : winget install Deno.Land  ou  https://ntl.fyi/install-deno
# 2) Sinon, contournement sans netlify dev : ATELIER_API_URL=http://localhost:9999/.netlify/functions,
#    build, puis "npm run dev:functions" (port 9999) + serveur statique (ex. npx serve dist -l 3000),
#    ouvrir http://localhost:3000. Ce projet n'utilise que des Netlify Functions (Node), pas d'Edge.

# Netlify Forms (formulaire d’inscription)
# Configurer dans Netlify : Settings > Forms > Form notifications > Add notification > Email
# Destinataire : atelierstelme@gmail.com (ou info@atelierstelme.ca)

