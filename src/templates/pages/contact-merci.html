{% extends "page.html" %}

{% block content %}
  <section class="section section-page-hero inscription-hero">
    <div class="container">
      <h1 class="page-title">{{ page.title }}</h1>
    </div>
  </section>

  <section class="section inscription-section">
    <div class="container container-narrow">
      <div class="success-card">
        <div class="success-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>

        <div class="success-content">
          <p class="lead">{{ content | safe }}</p>
        </div>

        <div class="success-actions">
          <a href="/a-propos" class="btn btn-primary">Retour à la page À propos</a>
          <a href="/" class="btn btn-outline">Retour à l'accueil</a>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
